name: Test include-only pattern - keep only src results
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create input SARIF fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-fixtures"
          cat > "$GITHUB_WORKSPACE/test-fixtures/basic.sarif" << 'SARIF_EOF'
          {
            "version": "2.1.0",
            "runs": [{
              "tool": {"driver": {"name": "TestTool", "rules": [
                {"id": "rule/001", "defaultConfiguration": {"level": "error"}},
                {"id": "rule/002", "defaultConfiguration": {"level": "warning"}}
              ]}},
              "results": [
                {"ruleId": "rule/001", "level": "error", "message": {"text": "Error in src"},
                 "locations": [{"physicalLocation": {"artifactLocation": {"uri": "src/main.py"}}}]},
                {"ruleId": "rule/002", "level": "warning", "message": {"text": "Warning in tests"},
                 "locations": [{"physicalLocation": {"artifactLocation": {"uri": "tests/test_main.py"}}}]},
                {"ruleId": "rule/001", "level": "error", "message": {"text": "Error in vendor"},
                 "locations": [{"physicalLocation": {"artifactLocation": {"uri": "vendor/lib.py"}}}]}
              ]
            }]
          }
          SARIF_EOF

      - id: action
        uses: .
        with:
          # First exclude all, then include only src/ results
          patterns: |
            -**
            src/**
          input: "${{ github.workspace }}/test-fixtures/basic.sarif"
          output: "${{ github.workspace }}/output-include.sarif"

      - name: Assert output file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/output-include.sarif" ]; then
            echo "FAIL: output SARIF file was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert only src/ results remain (1 out of 3)
        run: |
          COUNT=$(python3 -c "
          import json
          with open('$GITHUB_WORKSPACE/output-include.sarif') as f:
              s = json.load(f)
          total = sum(len(r.get('results', [])) for r in s.get('runs', []))
          print(total)
          ")
          echo "Result count: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected 1 result (only src/main.py), got $COUNT"
            exit 1
          fi
          echo "PASS: only 1 src/ result remains"

      - name: Assert the remaining result is from src/
        run: |
          URI=$(python3 -c "
          import json
          with open('$GITHUB_WORKSPACE/output-include.sarif') as f:
              s = json.load(f)
          for run in s.get('runs', []):
              for result in run.get('results', []):
                  for loc in result.get('locations', []):
                      uri = loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')
                      print(uri)
          ")
          echo "URI: $URI"
          if [ "$URI" != "src/main.py" ]; then
            echo "FAIL: expected src/main.py, got $URI"
            exit 1
          fi
          echo "PASS: remaining result is from src/main.py"
