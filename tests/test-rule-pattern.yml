name: Test rule-based pattern - filter by rule ID
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create input SARIF fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-fixtures"
          cat > "$GITHUB_WORKSPACE/test-fixtures/basic.sarif" << 'SARIF_EOF'
          {
            "version": "2.1.0",
            "runs": [{
              "tool": {"driver": {"name": "TestTool", "rules": [
                {"id": "rule/001", "defaultConfiguration": {"level": "error"}},
                {"id": "rule/002", "defaultConfiguration": {"level": "warning"}}
              ]}},
              "results": [
                {"ruleId": "rule/001", "level": "error", "message": {"text": "Error in src"},
                 "locations": [{"physicalLocation": {"artifactLocation": {"uri": "src/main.py"}}}]},
                {"ruleId": "rule/002", "level": "warning", "message": {"text": "Warning in tests"},
                 "locations": [{"physicalLocation": {"artifactLocation": {"uri": "tests/test_main.py"}}}]},
                {"ruleId": "rule/001", "level": "error", "message": {"text": "Error in vendor"},
                 "locations": [{"physicalLocation": {"artifactLocation": {"uri": "vendor/lib.py"}}}]}
              ]
            }]
          }
          SARIF_EOF

      - id: action
        uses: .
        with:
          # Include all files, but exclude results for rule/002
          patterns: |
            **
            -**:rule/002
          input: "${{ github.workspace }}/test-fixtures/basic.sarif"
          output: "${{ github.workspace }}/output-rule.sarif"

      - name: Assert output file was created
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/output-rule.sarif" ]; then
            echo "FAIL: output SARIF file was not created"
            exit 1
          fi
          echo "PASS: output file exists"

      - name: Assert only rule/001 results remain (2 out of 3)
        run: |
          COUNT=$(python3 -c "
          import json
          with open('$GITHUB_WORKSPACE/output-rule.sarif') as f:
              s = json.load(f)
          total = sum(len(r.get('results', [])) for r in s.get('runs', []))
          print(total)
          ")
          echo "Result count: $COUNT"
          if [ "$COUNT" != "2" ]; then
            echo "FAIL: expected 2 results (rule/002 excluded), got $COUNT"
            exit 1
          fi
          echo "PASS: 2 results remain after excluding rule/002"

      - name: Assert no rule/002 results remain
        run: |
          RULE002_COUNT=$(python3 -c "
          import json
          with open('$GITHUB_WORKSPACE/output-rule.sarif') as f:
              s = json.load(f)
          count = 0
          for run in s.get('runs', []):
              for result in run.get('results', []):
                  if result.get('ruleId') == 'rule/002':
                      count += 1
          print(count)
          ")
          echo "rule/002 count: $RULE002_COUNT"
          if [ "$RULE002_COUNT" != "0" ]; then
            echo "FAIL: expected no rule/002 results, found $RULE002_COUNT"
            exit 1
          fi
          echo "PASS: no rule/002 results remain"
