name: 'Filter SARIF'
description: 'Filter SARIF results by path'
inputs:
  patterns:
    description: 'Patterns for the results to remove. If a pattern starts with "-", it is an exclusion pattern, otherwise, it is an inclusion pattern.'
    required: true
  input:
    description: 'Path to the input SARIF file'
    required: true
  output:
    description: 'Path to the output SARIF file'
    required: true
  severity:
    description: 'Optional comma-separated list of severity levels to keep (e.g. "error,warning" or "high,critical"). Supports SARIF levels (error, warning, note, none) and security severity categories (critical, high, medium, low).'
    required: false
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: filter
      env:
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_INPUT: ${{ inputs.input }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_PATTERNS: ${{ inputs.patterns }}
      run: |
        unset LD_PRELOAD
        if [ -n "$INPUT_SEVERITY" ]; then
          python3 "$GITHUB_ACTION_PATH/filter_sarif.py" --input "$INPUT_INPUT" --output "$INPUT_OUTPUT" --split-lines --severity "$INPUT_SEVERITY" -- "$INPUT_PATTERNS"
        else
          python3 "$GITHUB_ACTION_PATH/filter_sarif.py" --input "$INPUT_INPUT" --output "$INPUT_OUTPUT" --split-lines -- "$INPUT_PATTERNS"
        fi
      shell: bash
